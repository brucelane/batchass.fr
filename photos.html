    <script>
        document.querySelectorAll('img').forEach((img) => {
            if (img.closest('#carouselFade')) {
                if (!img.hasAttribute('loading')) img.setAttribute('loading', 'eager');
                if (!img.hasAttribute('decoding')) img.setAttribute('decoding', 'async');
                return;
            }
            if (!img.hasAttribute('loading')) img.setAttribute('loading', 'lazy');
            if (!img.hasAttribute('decoding')) img.setAttribute('decoding', 'async');
        });
        document.querySelectorAll('iframe').forEach((iframe) => {
            if (!iframe.hasAttribute('loading')) iframe.setAttribute('loading', 'lazy');
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const carousel = document.getElementById('carouselFade');
            if (!carousel) return;

            const slides = Array.from(carousel.querySelectorAll('.carousel-item'));
            const preloadImage = (src) => {
                if (!src) return;
                const img = new Image();
                img.src = src;
                img.loading = 'eager';
                img.decoding = 'async';
            };

            const preloadNextSlide = () => {
                const currentIndex = slides.findIndex((slide) => slide.classList.contains('active'));
                const nextIndex = (currentIndex + 1 + slides.length) % slides.length;
                const nextImage = slides[nextIndex]?.querySelector('img');
                if (nextImage) {
                    preloadImage(nextImage.getAttribute('src'));
                }
            };

            slides.forEach((slide) => {
                const img = slide.querySelector('img');
                if (img && img.getAttribute('src')) {
                    preloadImage(img.getAttribute('src'));
                }
            });

            preloadNextSlide();
            carousel.addEventListener('slid.bs.carousel', preloadNextSlide);

            const currentPath = window.location.pathname.toLowerCase();
            const normalizedCurrent = currentPath === '/' ? '/index.html' : currentPath;

            document.querySelectorAll('.nav-item').forEach((item) => {
                const link = item.querySelector('.nav-link');
                if (!link) return;

                const href = new URL(link.href, window.location.href).pathname.toLowerCase();
                const isCurrent = href === normalizedCurrent ||
                    (normalizedCurrent === '/index.html' && (href === '/' || href === '/index.html'));

                item.classList.toggle('active', isCurrent);
                if (isCurrent) {
                    link.setAttribute('aria-current', 'page');
                } else {
                    link.removeAttribute('aria-current');
                }
            });
        });
    </script>
